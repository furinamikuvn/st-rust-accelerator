[package]
name = "st-server-addon"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi4", "serde-json"] }
napi-derive = "2.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simd-json = "0.14"
memmap2 = "0.9"
base64 = "0.22"
flate2 = "1.0"

[build-dependencies]
napi-build = "2.1"
